[package]
name = "persistence"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.0", features = [ "full" ] }
sqlx = { version = "0.7.4", features = [ "runtime-tokio-rustls", "macros", "postgres", "chrono", "uuid" ] }
chrono = "0.4.22"
uuid = { version = "1.2.1", features = ["v4"] }
anyhow = "1.0.75"
tonic = "0.11.0"
prost = "0.12.1"
tokio-stream = "0.1.14"
async-stream = "0.3.5"
prost-types = "0.12.1"

[build-dependencies]
tonic-build = "0.11.0"
